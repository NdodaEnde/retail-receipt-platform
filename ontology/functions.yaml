# KlpIT Ontology — Function Catalogue (the intelligence layer).
# Versioned computed logic bound to objects/aggregates. Many already exist as
# SQL views (backend/schema.sql); this declares them with sensitivity + phase
# + how they're implemented today.
#
# Fields:
#   bound_to        object api_names and/or aggregates (market, suburb)
#   computes        what it produces
#   reads           object.property inputs (validated; drives the POPIA report)
#   output_class    sensitivity of what it emits (O|P|F|X)
#   exposure        internal | external   (external REQUIRES output_class X)
#   implemented_by  view:<name> (a real SQL view) | app (server.py code) | planned
#   min_users       user-volume tier it unlocks (from CLAUDE.md intelligence tiers)
#   phase           sprint/programme phase it goes live in
#   emits/invokes   object it creates / action it may fire
schema_version: "0.1"

functions:

  # ── Phase 1 — live ────────────────────────────────────────────────────────
  fraudScore:
    bound_to: [receipt]
    computes: "Multi-signal fraud risk (distance + velocity + duplicate) -> flag/score"
    reads: [receipt.distance_km, receipt.amount, receipt.shop_latitude, receipt.shop_longitude]
    output_class: O
    exposure: internal
    implemented_by: app
    invokes: [flagFraud]
    min_users: 0
    phase: 1

  drawEligibility:
    bound_to: [receipt]
    computes: "Is the receipt eligible for today's draw (OCR date vs upload date)"
    reads: [receipt.receipt_date, receipt.created_at]
    output_class: O
    exposure: internal
    implemented_by: app
    min_users: 0
    phase: 1

  dailySpending:
    bound_to: [market]
    computes: "Total/avg spend and receipt counts per day"
    reads: [receipt.amount, receipt.created_at]
    output_class: X
    exposure: external
    implemented_by: view:daily_spending
    min_users: 0
    phase: 1

  hourlyDistribution:
    bound_to: [market]
    computes: "Receipt volume by hour-of-day (anonymized shopping rhythm)"
    reads: [receipt.created_at]
    output_class: X
    exposure: external
    implemented_by: view:hourly_distribution
    min_users: 0
    phase: 1

  customerSummary:
    bound_to: [customer]
    computes: "Per-customer receipt count, total + avg spend"
    reads: [customer.total_receipts, customer.total_spent]
    output_class: F
    exposure: internal
    implemented_by: view:customer_summary
    min_users: 0
    phase: 1

  # ── Phase 2 — loyalty (Sprint 2, next) + shop analytics ──────────────────
  customerTier:
    bound_to: [customer]
    computes: "Bronze/Silver/Gold/Platinum from total_receipts"
    reads: [customer.total_receipts]
    output_class: O
    exposure: internal
    implemented_by: planned
    min_users: 50
    phase: 2

  streakTracking:
    bound_to: [customer]
    computes: "current_streak / longest_streak from consecutive receipt days"
    reads: [customer.total_receipts, receipt.receipt_date]
    output_class: O
    exposure: internal
    implemented_by: planned
    min_users: 50
    phase: 2

  shopPerformance:
    bound_to: [shop]
    computes: "Per-shop revenue, avg transaction, receipt count"
    reads: [shop.total_sales, receipt.amount]
    output_class: F
    exposure: internal
    implemented_by: view:shop_performance
    min_users: 50
    phase: 2

  topItems:
    bound_to: [market]
    computes: "Most-purchased raw item names + qty/price stats (pre-normalization)"
    reads: [receipt_item.name, receipt_item.quantity, receipt_item.unit_price]
    output_class: O
    exposure: internal            # raw OCR names — not exposable until normalized
    implemented_by: view:top_items
    min_users: 50
    phase: 2

  # ── Phase 3 — behavioural + normalization ────────────────────────────────
  churnRisk:
    bound_to: [customer]
    computes: "Days since last receipt vs personal cadence -> churn probability"
    reads: [customer.total_receipts, receipt.created_at]
    output_class: O
    exposure: internal
    implemented_by: view:customer_behavior
    min_users: 200
    phase: 3

  itemNormalization:              # resolves the item-normalization bottleneck (LIVE, rules-first)
    bound_to: [receipt_item]
    computes: "Map raw OCR item name -> canonical_name + canonical_key + category + brand"
    reads: [receipt_item.name, receipt_item.unit_price]
    output_class: O
    exposure: internal
    implemented_by: app           # backend/item_normalizer.py, applied at item insert
    min_users: 0
    phase: 3

  categorySpend:                  # unlocked by itemNormalization
    bound_to: [market]
    computes: "Spend / qty / avg unit price per retail category per month"
    reads: [receipt_item.category, receipt_item.total_price, receipt_item.quantity, receipt_item.unit_price]
    output_class: X
    exposure: external
    implemented_by: view:category_spend
    min_users: 50
    phase: 3

  basketAffinity:                 # exposable ONLY on canonical category, not raw names
    bound_to: [market]
    computes: "Co-purchase affinity between product categories"
    reads: [product.category]
    output_class: X
    exposure: external
    implemented_by: view:item_pairs
    min_users: 200
    phase: 3

  # ── Phase 4 — SA-context moat + B2B (needs volume) ───────────────────────
  suburbSpendIndex:
    bound_to: [suburb]
    computes: "Anonymized suburb-level spend density (aggregated; no per-receipt detail)"
    reads: [receipt.geocode_precision, shop.latitude, shop.longitude, receipt.amount]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 500
    phase: 4

  sassaGrantCycleImpact:
    bound_to: [market]
    computes: "Spend uplift around SASSA grant payment dates (aggregate)"
    reads: [receipt.amount, receipt.created_at]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 500
    phase: 4

  marketShareEstimate:            # B2B data product
    bound_to: [suburb]
    computes: "Estimated retailer share of wallet per suburb (category-level)"
    reads: [product.category, shop.name]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 1000
    phase: 4

  # ── Geographic behavioural intelligence (site-selection B2B product) ──────
  # All aggregate to suburb-level with k-anonymity before exposure; the gate
  # keeps output_class X even though several read Personal location (P).
  travelForPurpose:
    bound_to: [suburb]
    computes: "Avg trip distance by category — do people travel further to dine than to buy groceries?"
    reads: [receipt.geocode_precision, receipt_item.category, receipt.distance_km, receipt.shop_latitude, receipt.shop_longitude, customer.last_latitude, customer.last_longitude]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 500
    phase: 4

  categoryDemandBySuburb:
    bound_to: [suburb]
    computes: "Category spend / qty per suburb — what is consumed most in each area"
    reads: [receipt.geocode_precision, receipt_item.category, receipt_item.total_price, receipt.shop_latitude, receipt.shop_longitude]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 500
    phase: 4

  suburbWalletShare:
    bound_to: [suburb]
    computes: "Cross-retailer share of wallet per suburb — who is winning the basket here"
    reads: [receipt.geocode_precision, shop.name, receipt.amount, receipt.shop_latitude, receipt.shop_longitude]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 500
    phase: 4

  retailLeakage:                  # the synthesis -> site-opportunity score
    bound_to: [suburb]
    computes: "Out-of-suburb spend by category (demand leaking elsewhere) -> ranked site-opportunity / new-store score"
    reads: [receipt.geocode_precision, receipt_item.category, receipt.amount, receipt.shop_latitude, receipt.shop_longitude, customer.last_latitude, customer.last_longitude]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 1000
    phase: 4

  # ── Price observatory (receipt-volume gated, NOT user-volume gated) ───────
  itemPriceIndex:
    bound_to: [market]
    computes: "Median/avg price per canonical item per month across branches — hyperlocal inflation index (CPI complement)"
    reads: [receipt_item.canonical_name, receipt_item.category, receipt_item.unit_price, receipt.receipt_date, shop.place_id]
    output_class: X
    exposure: external
    implemented_by: view:item_price_index
    min_users: 0                  # gated by normalization coverage + receipt_date, not users
    phase: 3

  pricePremiumByBranch:
    bound_to: [suburb]
    computes: "Price dispersion for identical canonical items across branches/suburbs — the 'township premium', quantified"
    reads: [receipt.geocode_precision, receipt_item.canonical_name, receipt_item.unit_price, shop.place_id, shop.latitude, shop.longitude]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 200
    phase: 4

  promoLift:
    bound_to: [market]
    computes: "Price-drop detection per canonical item + basket change around it — campaign attribution for sponsors"
    reads: [receipt_item.canonical_name, receipt_item.unit_price, receipt.receipt_date]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 200
    phase: 4

  # ── Behaviour & patronage ─────────────────────────────────────────────────
  behavioralArchetypes:
    bound_to: [customer]
    computes: "Rule-based shopper archetypes (frequency x basket size x category mix) — feeds tiers, churn, targeting"
    reads: [customer.total_receipts, customer.total_spent, receipt.created_at, receipt.amount]
    output_class: O
    exposure: internal
    implemented_by: planned
    min_users: 50
    phase: 3

  shopMissions:
    bound_to: [shop]
    computes: "Basket size x category mix per branch -> mission mix (top-up | monthly shop | meal)"
    reads: [receipt_item.category, receipt.amount, shop.place_id]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 200
    phase: 4

  coPatronage:
    bound_to: [suburb]
    computes: "Branches sharing customers (patronises link) -> competitive adjacency graph, gravity-model input"
    reads: [receipt.customer, receipt.shop, shop.place_id]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 200
    phase: 4

  paydayPulse:
    bound_to: [market]
    computes: "Spend curve across the month — SASSA grant days vs month-end salaries vs mid-month (generalizes sassaGrantCycleImpact)"
    reads: [receipt.amount, receipt.receipt_date]
    output_class: X
    exposure: external
    implemented_by: planned
    min_users: 100
    phase: 4

  # ── Platform self-measurement (computable now) ────────────────────────────
  incentiveElasticity:
    bound_to: [market]
    computes: "Receipts/user in the 28 days before vs after a first draw win — measures whether the lottery mechanic drives habit (sponsor-pitch number)"
    reads: [draw.winner_customer, draw.draw_date, receipt.created_at, customer.total_receipts]
    output_class: X
    exposure: external
    implemented_by: view:incentive_elasticity
    min_users: 0
    phase: 3

  branchContext:
    bound_to: [shop]
    computes: "Enrich branches via place_id from Google Places (rating, price level, opening hours) — utilisation & context joins"
    reads: [shop.place_id, shop.latitude, shop.longitude]
    output_class: O
    exposure: internal
    implemented_by: planned
    min_users: 0
    phase: 3

  ontologyCoverage:
    bound_to: [market]
    computes: "Share of rows actually carrying each declared property (normalization %, receipt_date %, geocode precision mix) — the ontology auditing its own honesty"
    reads: [receipt.geocode_precision, receipt.receipt_date, receipt_item.canonical_name, receipt_item.category]
    output_class: O
    exposure: internal
    implemented_by: app           # scripts/ontology_coverage.py
    min_users: 0
    phase: 3
